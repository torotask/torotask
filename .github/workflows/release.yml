name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    if: github.repository == 'torotask/torotask'
    permissions:
      contents: write # to create release (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write #  required for provenance and oidc publish
    # prevents this action from running on forks
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Changesets uses git tags to decide what is already published.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: true

      - name: Install OIDC-compatible npm
        # Changesets 2.29 expects `npm info --json` to return an object; npm 12 returns an array.
        run: npm install --global npm@11.6.2

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm publish:packages
          commit: '[ci] release'
          title: '[ci] release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
